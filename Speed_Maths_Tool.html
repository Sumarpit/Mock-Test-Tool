<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <title>CGL Calculation Core v15 - Mastery Edition</title>
    <style>
        :root {
            --bg-main: #0E1015;
            --panel-bg: #21232B;
            --text-main: #FFFFFF;
            --text-muted: #8E929D;
            --circle-bg: #2A2D35;
            --circle-fg: #94C2FF;
            --danger-text: #F29C9C;
            --success-text: #81C995;
            --key-bg: #323642;
            --key-active: #4B5162;
            --accent: #94C2FF;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; 
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* --- View Routing --- */
        .view { display: none; flex-direction: column; height: 100%; }
        .view.active { display: flex; }

        /* --- HOME VIEW --- */
        .header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        .header h1 { font-size: 22px; margin: 0 0 5px 0; letter-spacing: -0.5px; }
        .header p { color: var(--text-muted); font-size: 13px; margin: 0; }
        
        .grid-menu {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            overflow-y: auto; padding-bottom: 20px;
        }
        .menu-btn {
            background-color: var(--panel-bg); border: 1px solid #333;
            color: var(--text-main); padding: 15px 12px; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            text-align: left; display: flex; flex-direction: column; gap: 4px;
        }
        .menu-btn:active { background-color: var(--key-bg); border-color: var(--text-muted); }
        .menu-btn .sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }
        
        /* --- CONFIG VIEW --- */
        .config-panel { background-color: var(--panel-bg); border-radius: 12px; padding: 20px; margin-top: 10px; }
        .config-group { margin-bottom: 15px; text-align: left; }
        .config-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        .config-input { width: 100%; background-color: #16181D; border: 1px solid #333; color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        .config-input:focus { border-color: var(--accent); }
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .action-btn { width: 100%; background-color: var(--accent); color: #000; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .back-btn { background: none; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 5px 0; display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }

        /* --- QUIZ VIEW & STRUCTURAL LAYOUT --- */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; margin-bottom: 10px; }
        
        .quiz-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 15px;
        }

        .quiz-left, .quiz-right {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .timer-module { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; min-height: 180px; }
        .svg-circle { width: 200px; height: 200px; transform: rotate(-90deg); transition: width 0.3s, height 0.3s; }
        .circle-bg { fill: none; stroke: var(--circle-bg); stroke-width: 12; }
        .circle-fg { fill: none; stroke: var(--circle-fg); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 603; stroke-dashoffset: 0; }
        .timer-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 80%; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        
        .question-text { font-size: 28px; font-weight: 700; margin-bottom: 8px; white-space: nowrap; line-height: 1.2; text-align: center; width: 100%; overflow: hidden; }
        .instruction-text { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
        .feedback-text { font-size: 14px; font-weight: 700; height: 18px; text-transform: uppercase; }
        .correct { color: var(--success-text); }
        .incorrect { color: var(--danger-text); }
        .paused-text { color: #F8C060; }
        
        .input-panel { background-color: var(--panel-bg); border-radius: 10px; padding: 15px; text-align: center; }
        .virtual-input { background-color: #16181D; border-radius: 8px; padding: 12px; font-size: 20px; font-weight: 600; color: var(--text-muted); min-height: 48px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .virtual-input.has-value { color: var(--text-main); }
        
        .stats-row { display: flex; justify-content: space-between; padding: 15px 10px 0; }
        .stat-block { text-align: center; flex: 1; }
        .stat-block:nth-child(2) { border-left: 1px solid #333; border-right: 1px solid #333; }
        .stat-label { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 2px; letter-spacing: 0.5px; }
        .stat-value { font-size: 15px; font-weight: 700; }
        .stat-progress { color: var(--accent); font-size: 11px; font-weight: 600; display: block; margin-top: 2px;}
        
        .keyboard-container { margin-top: auto; padding-bottom: 5px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end;}
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .alphapad { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: 100%; }
        .key { background-color: var(--key-bg); color: var(--text-main); border: none; border-radius: 8px; padding: 14px 0; font-size: 20px; font-weight: 600; cursor: pointer; user-select: none; }
        .key:active { background-color: var(--key-active); }
        .key.action-key { font-size: 14px; background-color: #21232B; }
        .key.space-key { grid-column: span 3; font-size: 14px; background-color: #21232B; }
        .key.alpha-space { grid-column: span 6; font-size: 14px; background-color: #21232B; }
        .key.alpha-del { grid-column: span 4; font-size: 14px; background-color: #21232B; color: var(--danger-text); }
        .ac-key { color: var(--danger-text); font-weight: 800; }

        /* --- MOBILE HORIZONTAL LAYOUT (< 600px width) --- */
        @media (max-width: 600px) {
            .container { padding: 10px; max-width: 100%; }
            .quiz-content { flex-direction: row; align-items: stretch; gap: 10px; }
            .quiz-left { flex: 0.8; justify-content: center; gap: 5px;}
            .quiz-right { flex: 1.2; justify-content: center; }
            
            .svg-circle { width: 130px; height: 130px; }
            .circle-bg, .circle-fg { stroke-width: 10; stroke-dasharray: 393; } /* 2 * pi * 62.5 */
            
            .timer-module { min-height: 140px; flex: none; }
            .question-text { font-size: 20px; margin-bottom: 5px; }
            .instruction-text { font-size: 9px; margin-bottom: 2px;}
            .feedback-text { font-size: 12px; height: 14px; }
            
            .input-panel { padding: 8px; border-radius: 8px; }
            .virtual-input { min-height: 38px; font-size: 18px; padding: 5px; }
            
            .stats-row { flex-direction: column; padding: 5px 0 0; gap: 5px; }
            .stat-block { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: var(--panel-bg); border-radius: 6px; border: none !important; }
            .stat-label { margin-bottom: 0; }
            .stat-progress { display: inline; margin-left: 5px; }
            
            .numpad { gap: 6px; }
            .key { padding: 12px 0; font-size: 18px; }
        }
    </style>
</head>
<body>

<script>
    // --- Global State ---
    let activeMode = null;
    let activeConfig = {};
    let currentAnswer = "";
    let currentInput = "";
    let attempts = 0, correct = 0;
    let isTransitioning = false, isPaused = false;
    let currentQData = null;
    let globalSessionTick = 0; 
    
    // Timer 
    let animationFrameId, startTime = null, pausedRemaining = 4000;
    const TIME_LIMIT = 4000;
    let CIRCUMFERENCE = 603.18; // Default desktop SVG r=96

    // Mastery Tracking
    let totalCombinations = Infinity;
    let masteredKeys = new Set();
    let fireworksFired = false;

    // --- Spaced Repetition State (SM-2 simplified implementation) ---
    const sm2Memory = new Map();
    // { n: repetitions, ef: easiness factor, dueTick: globalSessionTick target, totalCorrect: 0 }

    function getSM2Data(qId) {
        if (!sm2Memory.has(qId)) {
            sm2Memory.set(qId, { n: 0, ef: 2.5, dueTick: globalSessionTick, totalCorrect: 0 });
        }
        return sm2Memory.get(qId);
    }

    function processReview(qId, quality) {
        const mem = getSM2Data(qId);
        
        // Quality 0-5. 5 is fast correct, 0 is wrong/timeout.
        let newEf = mem.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
        if (newEf < 1.3) newEf = 1.3;

        let interval;
        if (quality < 3) {
            mem.n = 0;
            interval = 2; // Show again in 2 ticks
        } else {
            if (mem.n === 0) interval = 1;
            else if (mem.n === 1) interval = 6;
            else interval = Math.round(mem.interval * newEf);
            
            if(interval > 25) interval = 25; 
            mem.n += 1;
            
            // Track Mastery
            mem.totalCorrect++;
            if (mem.totalCorrect >= 10 && !masteredKeys.has(qId)) {
                masteredKeys.add(qId);
                checkMasteryCelebration();
            }
        }

        mem.ef = newEf;
        mem.interval = interval;
        mem.dueTick = globalSessionTick + interval;
    }

    function getDueCountForMode(mode) {
        let count = 0;
        for (const [key, mem] of sm2Memory.entries()) {
            if (key.startsWith(`[${mode}]`) && mem.dueTick <= globalSessionTick) {
                count++;
            }
        }
        return count;
    }

    function checkMasteryCelebration() {
        if (totalCombinations !== Infinity && masteredKeys.size >= totalCombinations && !fireworksFired) {
            fireworksFired = true;
            triggerConfetti();
        }
        updateMasteryUI();
    }

    function updateMasteryUI() {
        const display = document.getElementById('masteryDisplay');
        if (totalCombinations === Infinity) {
            display.innerText = `Mastery: N/A`;
        } else {
            const pct = Math.min(100, Math.floor((masteredKeys.size / totalCombinations) * 100));
            display.innerText = `Mastery: ${pct}%`;
        }
    }


    // --- Hardcoded Datasets ---
    const sscFractions = [
        { q: "Find '?':\n33.33% = 1 / ?", a: "3", id: "f1" }, { q: "Find '?':\n25% = 1 / ?", a: "4", id: "f2" },
        { q: "Find '?':\n20% = 1 / ?", a: "5", id: "f3" }, { q: "Find '?':\n16.66% = 1 / ?", a: "6", id: "f4" },
        { q: "Find '?':\n14.28% = 1 / ?", a: "7", id: "f5" }, { q: "Find '?':\n12.5% = 1 / ?", a: "8", id: "f6" },
        { q: "Find '?':\n11.11% = 1 / ?", a: "9", id: "f7" }, { q: "Find '?':\n9.09% = 1 / ?", a: "11", id: "f8" },
        { q: "Find '?':\n8.33% = 1 / ?", a: "12", id: "f9" }, { q: "Find '?':\n7.14% = 1 / ?", a: "14", id: "f10" },
        { q: "Find '?':\n6.66% = 1 / ?", a: "15", id: "f11" }, { q: "Find '?':\n6.25% = 1 / ?", a: "16", id: "f12" },
        { q: "Find '?':\n66.66% = ? / 3", a: "2", id: "f13" }, { q: "Find '?':\n75% = ? / 4", a: "3", id: "f14" },
        { q: "Find '?':\n40% = ? / 5", a: "2", id: "f15" }, { q: "Find '?':\n60% = ? / 5", a: "3", id: "f16" },
        { q: "Find '?':\n80% = ? / 5", a: "4", id: "f17" }, { q: "Find '?':\n83.33% = ? / 6", a: "5", id: "f18" },
        { q: "Find '?':\n37.5% = ? / 8", a: "3", id: "f19" }, { q: "Find '?':\n62.5% = ? / 8", a: "5", id: "f20" },
        { q: "Find '?':\n87.5% = ? / 8", a: "7", id: "f21" }
    ];
    const triplets = [ [3, 4, 5], [6, 8, 10], [9, 12, 15], [5, 12, 13], [10, 24, 26], [7, 24, 25], [8, 15, 17], [9, 40, 41], [11, 60, 61], [12, 35, 37], [16, 63, 65], [20, 21, 29], [28, 45, 53], [33, 56, 65], [39, 80, 89] ];
    const rootsLogs = [
        { q: "√2", a: "1.41", id: "r1" }, { q: "√3", a: "1.73", id: "r2" }, 
        { q: "√5", a: "2.24", id: "r3" }, { q: "√7", a: "2.64", id: "r4" }, { q: "√10", a: "3.16", id: "r5" },
        { q: "log₁₀ 2", a: "0.30", id: "l1" }, { q: "log₁₀ 3", a: "0.47", id: "l2" }, 
        { q: "log₁₀ 5", a: "0.69", id: "l3" }, { q: "log₁₀ 7", a: "0.84", id: "l4" }
    ];
    const alphaMap = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const reversePairs = {'A':'Z','B':'Y','C':'X','D':'W','E':'V','F':'U','G':'T','H':'S','I':'R','J':'Q','K':'P','L':'O','M':'N','N':'M','O':'L','P':'K','Q':'J','R':'I','S':'H','T':'G','U':'F','V':'E','W':'D','X':'C','Y':'B','Z':'A'};
    const calendarCodes = [
        { q: "Month:\nJan (Std)", a: "1", id: "c1" }, { q: "Month:\nJan (Leap)", a: "0", id: "c2" },
        { q: "Month:\nFeb (Std)", a: "4", id: "c3" }, { q: "Month:\nFeb (Leap)", a: "3", id: "c4" },
        { q: "Month:\nMar", a: "4", id: "c5" }, { q: "Month:\nApr", a: "0", id: "c6" },
        { q: "Month:\nMay", a: "2", id: "c7" }, { q: "Month:\nJun", a: "5", id: "c8" },
        { q: "Month:\nJul", a: "0", id: "c9" }, { q: "Month:\nAug", a: "3", id: "c10" },
        { q: "Month:\nSep", a: "6", id: "c11" }, { q: "Month:\nOct", a: "1", id: "c12" },
        { q: "Month:\nNov", a: "4", id: "c13" }, { q: "Month:\nDec", a: "6", id: "c14" },
        { q: "Century:\n1600s/2000s", a: "6", id: "c15" }, { q: "Century:\n1700s", a: "4", id: "c16" },
        { q: "Century:\n1800s", a: "2", id: "c17" }, { q: "Century:\n1900s", a: "0", id: "c18" },
        { q: "Day:\nSunday", a: "1", id: "c19" }, { q: "Day:\nMonday", a: "2", id: "c20" },
        { q: "Day:\nTuesday", a: "3", id: "c21" }, { q: "Day:\nWednesday", a: "4", id: "c22" },
        { q: "Day:\nThursday", a: "5", id: "c23" }, { q: "Day:\nFriday", a: "6", id: "c24" },
        { q: "Day:\nSaturday", a: "0", id: "c25" }
    ];

    // --- Core Utilities ---
    function getRandomFromList(list) { return list[Math.floor(Math.random() * list.length)]; }
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function parseRangeString(inputStr) {
        let result = new Set();
        let parts = inputStr.split(',');
        for(let part of parts) {
            part = part.trim();
            if(part.includes('-')) {
                let [start, end] = part.split('-').map(Number);
                if(!isNaN(start) && !isNaN(end) && start <= end) {
                    for(let i = start; i <= end; i++) result.add(i);
                }
            } else {
                let num = Number(part);
                if(!isNaN(num)) result.add(num);
            }
        }
        return Array.from(result).filter(n => n > 0);
    }

    // --- Routing & Launch ---
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function goHome() {
        cancelAnimationFrame(animationFrameId);
        showView('view-home');
        activeMode = null;
    }

    function calculateTotalCombinations() {
        if (activeMode === 'tables') return activeConfig.bases.length * activeConfig.multipliers.length;
        if (activeMode === 'squares' || activeMode === 'cubes') return activeConfig.bases.length;
        if (activeMode === 'alpha') return activeConfig.types.length * 26;
        if (activeMode === 'fractions') return sscFractions.length;
        if (activeMode === 'triplets') return triplets.length * 3;
        if (activeMode === 'roots') return rootsLogs.length;
        if (activeMode === 'powers') return 29; // Fixed count for the hardcoded powers
        if (activeMode === 'calendar') return calendarCodes.length;
        return Infinity; // Arithmetic is infinite
    }

    function initializeSession() {
        resetStats();
        masteredKeys.clear();
        fireworksFired = false;
        totalCombinations = calculateTotalCombinations();
        updateMasteryUI();
        showView('view-quiz');
        
        // Setup SVG Circumference based on viewport
        const circle = document.querySelector('.circle-fg');
        const radius = circle.getAttribute('r');
        CIRCUMFERENCE = 2 * Math.PI * radius;
        circle.style.strokeDasharray = CIRCUMFERENCE;

        generateQuestion();
    }

    function launchDirect(mode) {
        activeMode = mode;
        activeConfig = {}; 
        initializeSession();
    }

    function openConfig(mode) {
        activeMode = mode;
        const title = document.getElementById('configTitle');
        const form = document.getElementById('configForm');
        form.innerHTML = '';

        if (mode === 'tables') {
            title.innerText = "Configure Tables";
            form.innerHTML = `<div class="config-group"><label>Table Numbers (Base)</label><input type="text" id="cfg-base" class="config-input" value="2-30"></div>
                              <div class="config-group"><label>Multipliers (Excl. 1)</label><input type="text" id="cfg-mult" class="config-input" value="2-9"></div>`;
        } else if (mode === 'squares') {
            title.innerText = "Configure Squares";
            form.innerHTML = `<div class="config-group"><label>Numbers to Square</label><input type="text" id="cfg-base" class="config-input" value="1-40"></div>`;
        } else if (mode === 'cubes') {
            title.innerText = "Configure Cubes";
            form.innerHTML = `<div class="config-group"><label>Numbers to Cube</label><input type="text" id="cfg-base" class="config-input" value="1-21"></div>`;
        } else if (mode === 'alpha') {
            title.innerText = "Configure Alphabet";
            form.innerHTML = `
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" id="cfg-fwd" checked> Forward Positions (A=1)</label>
                    <label class="checkbox-label"><input type="checkbox" id="cfg-rev" checked> Reverse Positions (Z=1)</label>
                    <label class="checkbox-label"><input type="checkbox" id="cfg-pair" checked> Reverse Pairs (A=Z)</label>
                </div>
            `;
        }
        showView('view-config');
    }

    function applyConfigAndStart() {
        activeConfig = {};
        if (['tables', 'squares', 'cubes'].includes(activeMode)) {
            let bases = parseRangeString(document.getElementById('cfg-base').value);
            if(bases.length === 0) bases = [2]; 
            activeConfig.bases = bases;

            if (activeMode === 'tables') {
                let mults = parseRangeString(document.getElementById('cfg-mult').value);
                mults = mults.filter(m => m !== 1); 
                if(mults.length === 0) mults = [2];
                activeConfig.multipliers = mults;
            }
        } else if (activeMode === 'alpha') {
            activeConfig.types = [];
            if(document.getElementById('cfg-fwd').checked) activeConfig.types.push(1);
            if(document.getElementById('cfg-rev').checked) activeConfig.types.push(2);
            if(document.getElementById('cfg-pair').checked) activeConfig.types.push(3);
            if(activeConfig.types.length === 0) activeConfig.types = [1];
        }
        initializeSession();
    }

    // --- Dynamic Text Fitting ---
    function fitText() {
        const qText = document.getElementById('questionText');
        const container = document.getElementById('timerContentEl');
        
        let fontSize = window.innerWidth <= 600 ? 22 : 28;
        qText.style.fontSize = fontSize + 'px';
        
        while (qText.scrollWidth > container.clientWidth && fontSize > 10) {
            fontSize -= 1;
            qText.style.fontSize = fontSize + 'px';
        }
    }

    // --- Data Construction ---
    function buildFreshConfig() {
        let a, b, type;
        switch(activeMode) {
            case 'tables':
                a = getRandomFromList(activeConfig.bases); b = getRandomFromList(activeConfig.multipliers);
                return { text: `${a} × ${b} = ?`, ans: (a * b).toString(), id: `tab-${a}-${b}` };
            case 'squares':
                a = getRandomFromList(activeConfig.bases);
                return { text: `${a}² = ?`, ans: (a * a).toString(), id: `sq-${a}` };
            case 'cubes':
                a = getRandomFromList(activeConfig.bases);
                return { text: `${a}³ = ?`, ans: (a * a * a).toString(), id: `cb-${a}` };
            case 'alpha':
                type = getRandomFromList(activeConfig.types); 
                let letterIndex = getRandomInt(0, 25); let letter = alphaMap[letterIndex];
                if (type === 1) return { text: `Pos of ${letter}?`, ans: (letterIndex + 1).toString(), id: `alf1-${letter}` };
                if (type === 2) return { text: `Rev Pos ${letter}?`, ans: (26 - letterIndex).toString(), id: `alf2-${letter}` };
                return { text: `Rev Pair ${letter}?`, ans: reversePairs[letter], id: `alf3-${letter}` };
            
            case 'powers':
                const pwrs = [ { b: 2, maxE: 12 }, { b: 4, maxE: 6 }, { b: 3, maxE: 6 }, { b: 5, maxE: 6 }, { b: 6, maxE: 4 } ];
                const p = getRandomFromList(pwrs);
                const exp = getRandomInt(2, p.maxE);
                return { text: `${p.b}^${exp} = ?`, ans: Math.pow(p.b, exp).toString(), id: `pwr-${p.b}-${exp}` };
            case 'fractions':
                const f = getRandomFromList(sscFractions);
                return { text: f.q, ans: f.a, id: f.id };
            case 'triplets':
                const t = getRandomFromList(triplets);
                const hIdx = getRandomInt(0, 2); 
                let dTrip = [...t]; dTrip[hIdx] = "?";
                return { text: `Triplet:\n${dTrip.join(', ')}`, ans: t[hIdx].toString(), id: `trip-${t.join('-')}-${hIdx}` };
            case 'roots':
                const r = getRandomFromList(rootsLogs);
                return { text: `${r.q} = ?\n(2 dec)`, ans: r.a, id: r.id };
            case 'calendar':
                let cal = getRandomFromList(calendarCodes);
                return { text: `${cal.q}?`, ans: cal.a, id: cal.id };
        }
    }

    function determineKeyboard() {
        if (/[A-Z]/.test(currentAnswer)) {
            document.getElementById('numpad').style.display = 'none';
            document.getElementById('alphapad').style.display = 'grid';
        } else {
            document.getElementById('numpad').style.display = 'grid';
            document.getElementById('alphapad').style.display = 'none';
        }
    }

    // --- Core Execution Loop ---
    function generateQuestion() {
        globalSessionTick++;
        isTransitioning = false; isPaused = false;
        cancelAnimationFrame(animationFrameId);
        
        currentInput = ""; updateDisplayInput();
        
        const fb = document.getElementById('feedbackText');
        fb.innerText = '';
        document.getElementById('timerCircle').style.strokeDashoffset = 0;
        document.getElementById('timerText').innerText = "4.0s";
        
        // SM-2 Review Check
        let dueKeys = [];
        for (const [key, mem] of sm2Memory.entries()) {
            if (key.startsWith(`[${activeMode}]`) && mem.dueTick <= globalSessionTick) {
                dueKeys.push(key);
            }
        }

        if (dueKeys.length > 0 && Math.random() < 0.60) {
            // Prioritize due questions
            const chosenKey = getRandomFromList(dueKeys);
            const parsedObj = JSON.parse(chosenKey.substring(chosenKey.indexOf(']') + 1));
            currentQData = parsedObj;
        } else {
            // New random question
            currentQData = buildFreshConfig();
        }

        const qTextEl = document.getElementById('questionText');
        qTextEl.innerText = currentQData.text;
        fitText();

        currentAnswer = currentQData.ans.toUpperCase();
        determineKeyboard();

        pausedRemaining = TIME_LIMIT;
        startTimer();
        
        updateStats(); // Refresh due count visually
    }

    // --- Manual Input Handling ---
    document.addEventListener('keydown', function(e) {
        if (document.getElementById('view-quiz').classList.contains('active')) {
            if (e.code === 'Space') { e.preventDefault(); handleKey('Space'); return; }
            if (isTransitioning || isPaused) return;
            
            if (e.key === 'Backspace' || e.key === 'Delete' || e.key.toLowerCase() === 'c') {
                handleKey('AC');
            }
            else if (/^[a-zA-Z0-9.]$/.test(e.key)) {
                handleKey(e.key.toUpperCase());
            }
        }
    });

    function handleKey(key) {
        if (key === 'Space') { togglePause(); return; }
        if (isTransitioning || isPaused) return;

        if (key === 'AC') {
            currentInput = "";
        } else {
            currentInput += key;
        }
        
        updateDisplayInput();
        checkAnswerLive();
    }

    function updateDisplayInput() {
        const display = document.getElementById('virtualInput');
        if (currentInput === "") {
            display.innerText = "Type answer..."; display.classList.remove('has-value');
        } else {
            display.innerText = currentInput; display.classList.add('has-value');
        }
    }

    // --- Timer & State Resolution ---
    function startTimer() {
        cancelAnimationFrame(animationFrameId);
        startTime = performance.now();
        function tick(timestamp) {
            if (isPaused || isTransitioning) return;
            const elapsed = timestamp - startTime;
            const remaining = Math.max(0, pausedRemaining - elapsed);
            
            document.getElementById('timerText').innerText = (remaining / 1000).toFixed(1) + 's';
            document.getElementById('timerCircle').style.strokeDashoffset = CIRCUMFERENCE * (1 - (remaining / TIME_LIMIT));
            
            if (remaining <= 0) handleTimeout();
            else animationFrameId = requestAnimationFrame(tick);
        }
        animationFrameId = requestAnimationFrame(tick);
    }

    function togglePause() {
        isPaused = !isPaused;
        const qText = document.getElementById('questionText');
        const fb = document.getElementById('feedbackText');
        
        if (isPaused) {
            cancelAnimationFrame(animationFrameId);
            const elapsed = performance.now() - startTime;
            pausedRemaining = Math.max(0, pausedRemaining - elapsed);
            qText.innerText = "PAUSED";
            fitText();
            fb.innerText = "[SPACE] TO RESUME";
            fb.className = "feedback-text paused-text";
        } else {
            startTime = performance.now();
            qText.innerText = currentQData.text;
            fitText();
            fb.innerText = "";
            startTimer();
        }
    }

    function triggerSuccess() {
        isTransitioning = true;
        cancelAnimationFrame(animationFrameId);
        
        attempts++; correct++;
        
        // SM-2 Update (Score 5 = Perfect Recall)
        const qKey = `[${activeMode}]${JSON.stringify(currentQData)}`;
        processReview(qKey, 5);
        
        const fb = document.getElementById('feedbackText');
        fb.innerText = "CORRECT"; fb.className = "feedback-text correct";
        
        updateStats();
        setTimeout(generateQuestion, 300); 
    }

    function checkAnswerLive() {
        if (currentInput === currentAnswer) { triggerSuccess(); }
    }

    function handleTimeout() {
        isTransitioning = true;
        cancelAnimationFrame(animationFrameId);

        document.getElementById('timerText').innerText = "0.0s";
        document.getElementById('timerCircle').style.strokeDashoffset = CIRCUMFERENCE;
        
        attempts++;
        
        // SM-2 Update (Score 0 = Complete Failure/Timeout)
        const qKey = `[${activeMode}]${JSON.stringify(currentQData)}`;
        processReview(qKey, 0);
        
        const fb = document.getElementById('feedbackText');
        fb.innerText = `ANS: ${currentAnswer}`; fb.className = "feedback-text incorrect";
        updateStats();

        setTimeout(generateQuestion, 1500);
    }

    function updateStats() {
        document.getElementById('scoreText').innerText = correct;
        document.getElementById('queueText').innerText = getDueCountForMode(activeMode);
    }

    function resetStats() { 
        attempts = 0; correct = 0; 
        sm2Memory.clear(); 
        masteredKeys.clear();
        fireworksFired = false;
        updateStats(); 
        updateMasteryUI();
    }

    // --- Fireworks Canvas Confetti ---
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
        const colors = ['#94C2FF', '#81C995', '#F8C060', '#F29C9C', '#FFFFFF'];
        for(let i=0; i<100; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                r: Math.random() * 6 + 2,
                dx: Math.random() * 10 - 5,
                dy: Math.random() * -10 - 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 1.0,
                decay: Math.random() * 0.015 + 0.005
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        requestAnimationFrame(animateConfetti);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.dy += 0.2; // gravity
            p.x += p.dx;
            p.y += p.dy;
            p.life -= p.decay;
            
            if(p.life <= 0) {
                particles.splice(i, 1);
                continue;
            }
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
    }

</script>
